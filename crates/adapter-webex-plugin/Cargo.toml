[package]
name = "adapter-webex-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — Cisco WebEx videoconference adapter packaged as a plugin (DESIGN.md §11 + §20)."

[lib]
crate-type = ["rlib"]

[dependencies]
plugin-sdk.workspace = true
adapter-webex = { path = "../adapter-webex" }
vc-core.workspace = true

chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# The interactive-auth export drives the OAuth exchange itself, so it needs its
# own client: the adapter's lives behind an open instance, and sign-in happens
# before there is one.
reqwest.workspace = true

[dev-dependencies]
plugin-core.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
