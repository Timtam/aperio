[package]
name = "cal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — shared types, traits, and error definitions for all adapters."

[dependencies]
# TypeScript generation, pulled in only by the `ts-export` feature below.
ts-rs = { workspace = true, optional = true }
# Collation, see src/collation.rs. Optional and off by default: the baked
# CLDR data weighs about a megabyte, and twelve adapter repositories
# compile against this crate without ever sorting a list. Only the
# frontend bindings switch it on.
icu_collator = { workspace = true, optional = true }
icu_locale_core = { workspace = true, optional = true }
async-trait.workspace = true
serde.workspace = true
chrono.workspace = true
thiserror.workspace = true
# Photo bytes round-trip across the Tauri IPC and adapter wire
# formats (vCard PHOTO body, EWS contact-picture attachment) as
# base64. Defining the encoding once at the cal-core layer means
# every adapter and the command-layer serialize / deserialize the
# same way — no per-adapter base64 quirks.
base64 = "0.22"
# The Aperio-Extras codec (task::extras) serializes a forward-compatible
# metadata bag to JSON before base64-ing it into a provider field, so
# serde_json is a runtime dependency, not just a test one.
#
# float_roundtrip: the task-settings door reads numbers JavaScript wrote, in
# JSON.stringify's shortest round-trip spelling. Without it a few of them read
# back one ULP away, enough to snap a minute to the other half hour.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# Folding two spellings of one join URL into the identity they share
# (src/meeting_link_grouping.rs). A real parser rather than a hand-rolled
# fold, because the fold has to resolve dot segments, drop a default port and
# convert an internationalised host to punycode — `münchen.example.com` and
# `xn--mnchen-3ya.example.com` are ONE host, and answering that they are two
# would silently stop offering a group. Three adapters already depend on this
# crate at the same major version.
url = "2"
# Folding what a person types into the zone search (src/zone_list.rs):
# decomposing "Zürich" into "Zu" + a combining mark so the mark can go. Already
# in every build of this crate through `url` -> `idna`, so the adapter
# repositories compile nothing new.
icu_normalizer.workspace = true
# The offsets of the world zone list (src/zone_list.rs, `zone_offsets`), behind
# the `zones` feature below.
chrono-tz = { workspace = true, optional = true }


[dev-dependencies]
# (serde_json is now a regular dependency above — used by the extras
# codec — so it no longer needs a separate dev-dependency entry.)

[lints]
workspace = true

# Generate the frontends' TypeScript types from these Rust ones. OFF by default.
#
# `shared/types.ts` mirrors them by hand today, and says so in its own header:
# "The crate cal-core is the source of truth; if a field changes there, mirror
# it here." A mirror kept by hand drifts, and a frontend in a language that is
# not TypeScript cannot use it at all.
#
# Optional and default-off on purpose. Cargo unifies features globally and
# twelve adapter repositories compile against this crate; nothing they build
# should pull a code generator into their graph. Only the generator turns it on.
[features]
ts-export = ["dep:ts-rs"]
# Text ordering for the frontends. See the comment on the dependency
# above, and DESIGN §4.4.
collation = ["dep:icu_collator", "dep:icu_locale_core"]
# The offsets of the world zone list, from chrono-tz's tzdata. OFF by default,
# and off in WebAssembly: chrono-tz costs the desktop's module about 879 KB.
# The phone's binding and the desktop host switch it on; both already link
# chrono-tz through host-core, so only the list's own code is new there (a
# prototype with the fold and the search: about 21.6 KB on arm64, see
# DESIGN-series-time-zone.md, stage 3). The names and the search need none of
# it and stay on.
zones = ["dep:chrono-tz"]
