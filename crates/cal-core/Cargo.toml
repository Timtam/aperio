[package]
name = "cal-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — shared types, traits, and error definitions for all adapters."

[dependencies]
async-trait.workspace = true
serde.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
thiserror.workspace = true
uuid.workspace = true
# Photo bytes round-trip across the Tauri IPC and adapter wire
# formats (vCard PHOTO body, EWS contact-picture attachment) as
# base64. Defining the encoding once at the cal-core layer means
# every adapter and the command-layer serialize / deserialize the
# same way — no per-adapter base64 quirks.
base64 = "0.22"
# The Aperio-Extras codec (task::extras) serializes a forward-compatible
# metadata bag to JSON before base64-ing it into a provider field, so
# serde_json is a runtime dependency, not just a test one.
serde_json.workspace = true

[dev-dependencies]
# (serde_json is now a regular dependency above — used by the extras
# codec — so it no longer needs a separate dev-dependency entry.)

[lints]
workspace = true
