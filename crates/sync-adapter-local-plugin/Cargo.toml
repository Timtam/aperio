[package]
name = "sync-adapter-local-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — local-filesystem sync adapter packaged as a plugin (DESIGN.md §20)."

[lib]
# rlib-only: the #[no_mangle] C-ABI exports the host dlopens live in the
# companion `sync-adapter-local-cdylib` crate, so this crate (and the other
# -plugin rlibs) can be statically linked into one binary on mobile without
# colliding on duplicate exports. Integration tests call the typed twins
# (build_descriptor / DESTROY_FN) directly.
crate-type = ["rlib"]

[dependencies]
plugin-sdk.workspace = true
sync-adapter-local = { path = "../sync-adapter-local" }
sync-core.workspace = true

serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
# Sound-asset bytes cross the FFI boundary as base64 strings —
# same convention sync-core uses for the assets on disk so the
# wire shape lines up with what the FfiSyncAdapter shim
# expects.
base64 = "0.22"

[dev-dependencies]
plugin-core.workspace = true
tokio = { workspace = true }
tempfile = "3"

[lints]
workspace = true
