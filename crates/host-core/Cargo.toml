[package]
name = "host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — Tauri-free host logic shared by the desktop backend and the mobile UniFFI host: SQLite handle, data paths, accounts, secrets, adapter registry, cache + sync stores (DESIGN.md section 22)."

[dependencies]
# TypeScript generation, pulled in only by the `ts-export` feature below.
ts-rs = { workspace = true, optional = true }
aperio-db.workspace = true
# The E2E data key is stored base64-encoded in the keychain; the sync-target
# restore decodes it here so the wrap happens in one place rather than two.
base64 = "0.22"
builtin-oauth.workspace = true
cal-core.workspace = true
adapter-local.workspace = true
# The device adapter is not called from here — the mobile host holds the typed
# adapter — but `builtin_adapters` reads its manifest to learn the kind name,
# and that is a dependency whether or not it is declared. It used to be read by
# relative path, which worked only because the crates are neighbours.
adapter-device-calendar.workspace = true
plugin-core.workspace = true
sync-core.workspace = true
sync-engine.workspace = true
vc-core.workspace = true
rusqlite.workspace = true
thiserror.workspace = true
dirs.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
# File-backed logging core (§Diagnostics): the rolling file sink + reloadable
# filter builders + the redacted export, shared by the desktop logging glue and
# the mobile cal-ffi Host. `regex` backs the export redaction pass.
tracing-subscriber.workspace = true
tracing-appender.workspace = true
regex.workspace = true
# Content-addressing for the custom-sound importer (sound_assets::import_sound):
# files are stored as `<sha256>.<ext>` so identical audio dedupes.
sha2.workspace = true
# RRULE expansion for the reminder trigger enumeration (host_core::reminders).
chrono-tz.workspace = true
rrule.workspace = true
# The event_log cluster: onboarding reads the pending dir via tokio::fs; the
# desktop sync-round hooks are #[async_trait]. tokio cross-compiles to mobile
# (cal-ffi already links it).
tokio.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile = "3"
# The registry tests need ONE real plugin to register an account against.
# iCal is the cheapest: no keychain secret, and opening an instance does no
# network I/O (the feed is only fetched on the first read).
adapter-ical-plugin = { path = "../adapter-ical-plugin" }
# The sound-asset sync test drives a real local-filesystem sync target.
# (the folder mirror is part of `adapter-local` above)
# `travels_between_devices` has to be asked about a REAL sync-only adapter —
# one whose manifest declares `capabilities: ["sync"]` and nothing else. A
# hand-written twin would drift from the shipped manifests the way every
# hand-written twin in this workspace has. WebDAV, because the folder adapter
# folded into the built-in store and stopped being sync-ONLY in that sense.
adapter-webdav-plugin = { path = "../adapter-webdav-plugin" }
# "Does a videoconference account contribute its meetings calendar?" is a
# question about the REAL plugin: whether it exports `list_meetings` at all is
# what decides it, and a hand-written twin cannot answer that.
adapter-webex-plugin = { path = "../adapter-webex-plugin" }
# The sync-target connect/migrate tests assert against the field keys the SYNC
# adapters actually declare, so they read each one's shipped manifest. Same
# reason as WebDAV above; these four are the remaining kinds those tests cover.
# The failed-load naming test needs one real manifest to stage; CalDAV is the
# adapter whose accounts most often outlive a broken library.
adapter-caldav-plugin = { path = "../adapter-caldav-plugin" }
adapter-google-plugin = { path = "../adapter-google-plugin" }
adapter-sftp-plugin = { path = "../adapter-sftp-plugin" }
adapter-ftp-plugin = { path = "../adapter-ftp-plugin" }
adapter-dropbox-plugin = { path = "../adapter-dropbox-plugin" }
# Re-declare the engine + local adapter with their test-support features so the
# moved applier/onboarding/sync tests reach FakeSecrets / the in-memory store.
# Dev-only: the normal (mobile) build never enables these.
sync-engine = { workspace = true, features = ["test-support"] }
adapter-local = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# Generate the frontends' TypeScript types from these Rust ones. OFF by default.
#
# Optional and default-off on purpose: cargo unifies features globally and
# twelve adapter repositories compile against these crates; nothing they build
# should pull a code generator into their graph. Only `cargo xtask ts-types`
# turns it on. See cal-core for the full reasoning.
[features]
# Turns it on in the crates whose types these ones name — enabling it here
# alone would otherwise fail to compile.
ts-export = ["dep:ts-rs", "cal-core/ts-export", "plugin-core/ts-export"]
