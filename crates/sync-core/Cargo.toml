[package]
name = "sync-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — shared types and traits for cross-device sync (DESIGN.md §19)."

[dependencies]
# Adapters return async results across the network — every sync trait
# method is `async`, so we need the same dyn-async story the cal-core
# adapter traits use.
async-trait.workspace = true
# SyncEvent payloads round-trip as JSON Lines. Every adapter sees the
# same wire format; serde is the canonical encoder for both the log
# entries themselves and the meta.json / snapshot envelopes.
serde.workspace = true
serde_json = "1"
# Log entries carry RFC 3339 timestamps; chrono is the workspace's
# date-time library and already understood by every adapter.
chrono.workspace = true
# device_id is a UUID v4 generated on first run and persisted in
# user_prefs. Same uuid crate the local adapter uses for event UIDs.
uuid.workspace = true
# All error variants implement std::error::Error via thiserror — the
# crate boundary speaks `Result<T, SyncError>` so consumers (the
# command layer, individual sync adapters) get one place to map errors.
thiserror.workspace = true
# tracing for diagnostics, aligned with the rest of the workspace.
tracing.workspace = true

# E2E encryption (Phase Sk, DESIGN.md §19.7). AES-256-GCM gives
# authenticated encryption; argon2 derives the key from the user's
# passphrase with strong KDF parameters. base64 is the wire
# encoding for ciphertext blobs embedded in JSON snapshots.
aes-gcm.workspace = true
argon2.workspace = true
base64 = "0.22"
# rand only needed at runtime for fresh nonces + salts; the
# aes-gcm crate's `OsRng` re-export pulls this in but we depend
# explicitly for clarity.
rand = "0.8"

[dev-dependencies]
# Only the unit tests need an async runtime (`#[tokio::test]`). The crate's
# production code is runtime-agnostic (pure async-trait + serde), so its
# consumers — the app and every plugin cdylib — no longer link tokio
# through sync-core.
tokio = { workspace = true }

[lints]
workspace = true
