[package]
name = "host-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — static plugin registry: links the bundled adapter -plugin rlibs and registers them into a PluginManager without dlopen (the mobile/iOS path where dlopen is forbidden; DESIGN.md section 20)."

[dependencies]
plugin-core.workspace = true

# The 17 bundled adapter plugins, linked statically (rlib) rather than
# dlopen-ed. Optional + gated behind the `static` feature so a consumer that
# only wants the dlopen path (the desktop host) can depend on this crate with
# `default-features = false` and not drag the 17 rlibs into its binary.
cal-adapter-caldav-plugin = { path = "../cal-adapter-caldav-plugin", optional = true }
cal-adapter-ical-plugin = { path = "../cal-adapter-ical-plugin", optional = true }
cal-adapter-google-plugin = { path = "../cal-adapter-google-plugin", optional = true }
cal-adapter-microsoft-graph-plugin = { path = "../cal-adapter-microsoft-graph-plugin", optional = true }
cal-adapter-ews-plugin = { path = "../cal-adapter-ews-plugin", optional = true }
cal-adapter-vikunja-plugin = { path = "../cal-adapter-vikunja-plugin", optional = true }
cal-adapter-todoist-plugin = { path = "../cal-adapter-todoist-plugin", optional = true }
sync-adapter-webdav-plugin = { path = "../sync-adapter-webdav-plugin", optional = true }
sync-adapter-ftp-plugin = { path = "../sync-adapter-ftp-plugin", optional = true }
sync-adapter-sftp-plugin = { path = "../sync-adapter-sftp-plugin", optional = true }
sync-adapter-dropbox-plugin = { path = "../sync-adapter-dropbox-plugin", optional = true }
vc-adapter-webex-plugin = { path = "../vc-adapter-webex-plugin", optional = true }

[dev-dependencies]
# The credential-layer tests assert what the SHIPPED manifests imply about
# keychain slots, which is host-core's derivation, not this crate's.
host-core.workspace = true
sync-engine.workspace = true
# `manifests_parse` reads the two locale files to prove every kind an adapter
# declares has a label a screen reader can read out. A missing key is silent at
# runtime, so it has to be caught here.
serde_json.workspace = true

[features]
default = ["static"]

# Internal marker: enabled by every per-adapter feature below, so
# `register_all_static` + its imports compile whenever AT LEAST ONE adapter is
# linked (cargo has no "any-of" cfg, so the adapter features funnel through this).
registry = []

# Per-adapter selection — link + register exactly the adapters a consumer ships.
# This is the seam that lets the mobile build (cal-ffi) drop an adapter it does
# not offer simply by not enabling its feature, the static-link counterpart to
# the desktop omitting a cdylib from `plugins/bundled/`. `cal-adapter-local` is
# deliberately absent: it is the hardwired local store, not a bundled plugin.
caldav = ["registry", "dep:cal-adapter-caldav-plugin"]
ical = ["registry", "dep:cal-adapter-ical-plugin"]
google = ["registry", "dep:cal-adapter-google-plugin"]
microsoft-graph = ["registry", "dep:cal-adapter-microsoft-graph-plugin"]
ews = ["registry", "dep:cal-adapter-ews-plugin"]
vikunja = ["registry", "dep:cal-adapter-vikunja-plugin"]
todoist = ["registry", "dep:cal-adapter-todoist-plugin"]
sync-webdav = ["registry", "dep:sync-adapter-webdav-plugin"]
sync-ftp = ["registry", "dep:sync-adapter-ftp-plugin"]
sync-sftp = ["registry", "dep:sync-adapter-sftp-plugin"]
sync-dropbox = ["registry", "dep:sync-adapter-dropbox-plugin"]
vc-webex = ["registry", "dep:vc-adapter-webex-plugin"]

# Convenience: link + register ALL 17 bundled adapter plugins (the default).
static = [
    "caldav",
    "ical",
    "google",
    "microsoft-graph",
    "ews",
    "vikunja",
    "todoist",
    "sync-webdav",
    "sync-ftp",
    "sync-sftp",
    "sync-dropbox",
    "vc-webex",
]

[lints]
workspace = true
