[package]
name = "adapter-google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio Google Calendar adapter — OAuth 2.0 PKCE flow + REST API client."

[dependencies]
async-trait.workspace = true
cal-core.workspace = true
# The Drive half is a `SyncAdapter`; `futures` is what its parallel log
# fetch is built on. One provider, one crate, both roles.
sync-core.workspace = true
futures.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "macros", "rt", "time", "sync"] }
tracing.workspace = true
url = "2"
rand = "0.8"
# Localhost browser launcher for the OAuth redirect step.
# Tiny crate, platform-aware (uses `start` on Windows, `xdg-open`
# on Linux, `open` on macOS).
open = "5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mockito = "1"

[lints]
workspace = true
