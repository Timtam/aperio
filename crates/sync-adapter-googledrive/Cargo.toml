[package]
name = "sync-adapter-googledrive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio sync adapter targeting Google Drive API v3 over OAuth 2.0 PKCE."

[dependencies]
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = "1"
sync-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "net", "io-util", "macros", "rt", "sync", "time",
] }
tracing.workspace = true
url = "2"

# PKCE primitives — same set the Dropbox adapter uses.
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Browser launcher for the OAuth consent dance.
open = "5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
