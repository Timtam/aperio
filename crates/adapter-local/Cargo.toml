[package]
name = "adapter-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — local calendar and task adapter backed by SQLite."

[dependencies]
aperio-db.workspace = true
cal-core.workspace = true
# The store's sync half — `mirror` implements `SyncAdapter` against a
# folder. One crate per provider, and this provider is the device itself.
sync-core.workspace = true

async-trait.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Exposes the in-memory `test_support` module so downstream
# integration tests (notably the event-log applier in src-tauri)
# can spin up a fully-migrated SQLite without re-implementing
# the schema replay. Off by default in production builds.
test-support = []

[lints]
workspace = true
