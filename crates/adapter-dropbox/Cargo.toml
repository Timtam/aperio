[package]
name = "adapter-dropbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio sync adapter targeting Dropbox API v2 over OAuth 2.0 PKCE."

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json = "1"
sync-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "net", "io-util", "macros", "rt", "sync", "time",
] }
tracing.workspace = true
url = "2"

# PKCE: SHA-256 challenge derivation + base64 / hex encoding of
# the verifier + state nonce. Mirrors what adapter-google
# uses for its OAuth dance.
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"

# Open the user's default browser for the OAuth consent dance —
# same crate the Google adapter uses. Tiny, platform-aware
# (`start` on Windows, `xdg-open` on Linux, `open` on macOS).
open = "5"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
