[package]
name = "plugin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — plugin ABI contract, manifest parser, manager runtime, FFI shims (DESIGN.md §20)."

[dependencies]
# TypeScript generation, pulled in only by the `ts-export` feature below.
ts-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Dynamic plugin loader, used by the DESKTOP host. The mobile host
# (cal-ffi) never calls `scan_dir` — it links the adapters through
# `host-plugins` and registers them with `register_static` — but it
# does compile this crate, so libloading is on its graph too. Putting
# the loader behind a feature would be the way to change that, and
# nothing does today.
libloading.workspace = true
# `.aperio` community-plugin archives are ZIP-based — the
# archive module unzips them under plugins/user/.
zip.workspace = true
# The FFI shims (e.g. FfiCalendarAdapter) implement cal-core's
# Feature traits by serialising args / responses through the
# Adapter-side JSON bridge. sync-core's SyncAdapter trait does the
# same for sync-type plugins.
cal-core.workspace = true
sync-core.workspace = true
vc-core.workspace = true
async-trait.workspace = true
# spawn_blocking ferries synchronous FFI calls off the async runtime
# so a slow plugin can't stall the reactor.
tokio = { workspace = true }
tracing.workspace = true
chrono.workspace = true
# The sync shim base64-encodes sound-asset bytes before sending
# them across the FFI boundary (same convention sync-core's
# on-disk format uses) so the JSON-args contract stays clean.
base64 = "0.22"
# The plugin host-channel mints an unguessable capability token per
# instance — a derivable one could be forged by any plugin in the process.
rand = "0.8"
hex = "0.4"

[dev-dependencies]
# The manager's bundled-dir walk + missing-manifest paths are
# exercised via temp directories.
tempfile = "3"

[lints]
workspace = true

# Generate the frontends' TypeScript types from these Rust ones. OFF by default.
#
# Optional and default-off on purpose: cargo unifies features globally and
# twelve adapter repositories compile against these crates; nothing they build
# should pull a code generator into their graph. Only `cargo xtask ts-types`
# turns it on. See cal-core for the full reasoning.
[features]
# Turns it on in the crates whose types these ones name — enabling it here
# alone would otherwise fail to compile.
ts-export = ["dep:ts-rs", "cal-core/ts-export"]
