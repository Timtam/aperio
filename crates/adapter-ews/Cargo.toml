[package]
name = "adapter-ews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio Exchange Web Services (EWS) adapter — SOAP-over-HTTP client for legacy / on-premise Exchange servers."

[dependencies]
async-trait.workspace = true
cal-core.workspace = true
chrono.workspace = true
futures.workspace = true
# The device's zone names what an all-day slot was read on (events token).
iana-time-zone.workspace = true
# An all-day item's instants are midnights in its own zone (decision 217).
chrono-tz.workspace = true
rrule.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
url = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mockito = "1"

[lints]
workspace = true
