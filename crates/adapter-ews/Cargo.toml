[package]
name = "adapter-ews"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio Exchange Web Services (EWS) adapter — SOAP-over-HTTP client for legacy / on-premise Exchange servers."

[dependencies]
async-trait.workspace = true
# `zones`: a zone Exchange defines in full is matched to the tzdata zone that
# runs its clock (`cal_core::zone_with_clock`, decision 232), and an all-day
# item's instants are midnights in its own zone (decision 217, cal_core::Zone).
cal-core = { workspace = true, features = ["zones"] }
chrono.workspace = true
futures.workspace = true
# The device's zone names what an all-day slot was read on (events token).
iana-time-zone.workspace = true
# RFC 5545 expansion of a series' nominal pattern (in UTC). Aperio's fork, a
# path dependency: an extracted adapter repository needs its own
# `rrule = { path = "../crates/rrule" }` line beside cal-core's.
rrule.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
url = "2"
base64 = "0.22"
# The request an imported invitation goes in as (I6).
ical-mapping.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
mockito = "1"

[lints]
workspace = true
