plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.calffi'
version = '0.1.0'

android {
  namespace "expo.modules.calffi"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // UniFFI's generated Kotlin bindings (uniffi/cal_ffi/cal_ffi.kt) call the
  // Rust libcal_ffi.so through JNA.
  implementation "net.java.dev.jna:jna:5.14.0@aar"
  // Android Keystore-wrapped EncryptedSharedPreferences backs the
  // KeychainBridge (AndroidKeychain.kt) — account credentials never sit in
  // plaintext. The master key lives in the AndroidKeyStore (hardware-backed
  // where available); only the encrypted prefs file touches disk.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
