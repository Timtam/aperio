// The Compose compiler, for Glance (see the widget sources). Applied the way
// expo-modules-core applies it — `apply plugin:` after a buildscript classpath
// entry rather than the `plugins {}` DSL, because that is the shape already
// proven to resolve in this toolchain. `kotlinVersion` comes from the root
// project, and expo-dev-launcher already pulls Compose into the tree, so this
// adds a compiler plugin rather than a new world.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath(
      "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}"
    )
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.calffi'
version = '0.1.0'

android {
  namespace "expo.modules.calffi"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  // UniFFI's generated Kotlin bindings (uniffi/cal_ffi/cal_ffi.kt) call the
  // Rust libcal_ffi.so through JNA.
  //
  // 5.17.0 is a FLOOR, not a preference: JNA shipped libjnidispatch.so with
  // 4 KB-aligned LOAD segments until 5.17.0 (issue #1647). Google Play rejects
  // any upload whose native libraries are not 16 KB-aligned — enforced for new
  // apps since 2025-11-01 and for updates since 2026-05-01 — so 5.14.0 made the
  // bundle unshippable regardless of how our own Rust library was built.
  // Verified with `llvm-objdump -p`: 5.14.0's x86_64, armeabi-v7a and x86
  // variants report `align 2**12`. See mobile/PLAY_RELEASE.md section 2.1.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
  // Android Keystore-wrapped EncryptedSharedPreferences backs the
  // KeychainBridge (AndroidKeychain.kt) — account credentials never sit in
  // plaintext. The master key lives in the AndroidKeyStore (hardware-backed
  // where available); only the encrypted prefs file touches disk.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
  // Glance builds the home-screen widget. It renders to RemoteViews under the
  // hood, but gives us a real CheckBox — with the checkbox ROLE and state for
  // TalkBack, which hand-built RemoteViews cannot express. On a surface whose
  // whole point is "one element per task", that role is the feature.
  implementation "androidx.glance:glance-appwidget:1.1.1"
}
