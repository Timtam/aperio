plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.calffi'
version = '0.1.0'

android {
  namespace "expo.modules.calffi"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // UniFFI's generated Kotlin bindings (uniffi/cal_ffi/cal_ffi.kt) call the
  // Rust libcal_ffi.so through JNA.
  //
  // 5.17.0 is a FLOOR, not a preference: JNA shipped libjnidispatch.so with
  // 4 KB-aligned LOAD segments until 5.17.0 (issue #1647). Google Play rejects
  // any upload whose native libraries are not 16 KB-aligned — enforced for new
  // apps since 2025-11-01 and for updates since 2026-05-01 — so 5.14.0 made the
  // bundle unshippable regardless of how our own Rust library was built.
  // Verified with `llvm-objdump -p`: 5.14.0's x86_64, armeabi-v7a and x86
  // variants report `align 2**12`. See mobile/PLAY_RELEASE.md section 2.1.
  implementation "net.java.dev.jna:jna:5.17.0@aar"
  // Android Keystore-wrapped EncryptedSharedPreferences backs the
  // KeychainBridge (AndroidKeychain.kt) — account credentials never sit in
  // plaintext. The master key lives in the AndroidKeyStore (hardware-backed
  // where available); only the encrypted prefs file touches disk.
  implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
