[package]
name = "aperio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — accessible, cross-platform calendar and task application."
default-run = "aperio"

[[bin]]
name = "aperio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon`: optional close/minimize-to-tray (src/tray.rs). `image-png`:
# decode the embedded tray icon (icons/icon.png) at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
# Native file picker for the SFTP SSH-key path (DESIGN.md §19.6).
# A bare text input would let users mis-type the path; the picker
# also matches the platform's "select a file" idiom (NSOpenPanel
# on macOS, common-item-dialog on Windows, the portal on Linux).
tauri-plugin-dialog = "2"
# Opens validated http/https/mailto links in the OS default handler
# (browser / mail client) from the `open_external_url` command. Used
# instead of the Tauri opener plugin so the scheme allowlist lives in
# our own trusted command rather than a broad webview-facing
# capability — descriptions come from untrusted EWS invitations.
opener = "0.7"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
anyhow.workspace = true

cal-core.workspace = true
cal-adapter-local.workspace = true
sync-core.workspace = true
vc-core.workspace = true
plugin-core.workspace = true
# Zero direct adapter deps left after Iteration 9. Every
# external service (CalDAV/iCal/EWS/Vikunja/Todoist/Google/
# Microsoft Graph for calendars; WebDAV/FTP/SFTP/Dropbox/
# Google Drive/local for sync) is reached exclusively via
# dlopen-loaded plugins. Plugin-side hooks the host calls:
#   - normal vtable methods (CalendarAdapterVtable / SyncVtable):
#     all data-plane traffic.
#   - `aperio_plugin_interactive_auth` (Iteration 7): OAuth
#     dances for the 4 OAuth adapters.
#   - `aperio_plugin_discover` (Iteration 8): EWS Autodiscover.
#   - `aperio_plugin_probe_host_key` (Iteration 9): SFTP TOFU
#     first-use trust dialog probe.
# The local adapter (cal-adapter-local) stays as a workspace
# dep because the host uses its in-memory SQLite directly for
# the read-side (it IS the cache layer, not a remote service).

# NOTE: the 13 *-plugin crates are NOT listed as deps here.
# Plugins are loaded via dlopen from `plugins/bundled/` at
# runtime (DESIGN.md §20.5 + §22.2). Listing them as deps would
# force the host to link the plugin rlibs, which would collide
# on `#[no_mangle] aperio_plugin_create` across all 13 plugins.
# `build.rs` stages the cdylibs into `target/<profile>/plugins/
# bundled/<id>/` so `cargo run -p aperio` can find them at
# startup — but `cargo build --workspace` must have run first
# to actually produce those cdylibs.

base64 = "0.22"
# Custom notification-sound playback (§14.4). The notification plugin
# can only play NAMED system sounds, so we decode + play user-imported
# files ourselves on a dedicated audio thread. `symphonia-all` gives
# pure-Rust decoders for mp3/aac/flac/wav/ogg — no C codec deps to
# build. cpal (pulled transitively) needs ALSA headers on Linux, hence
# `libasound2-dev` in the CI / artifact Linux setup steps.
rodio = { version = "0.19", default-features = false, features = ["symphonia-all"] }
# SHA-256 content-addressing for the custom-sound importer (§19.2.2):
# files are stored as `<sha256>.<ext>` so identical audio dedupes and
# the sync asset store can fetch by hash.
sha2.workspace = true

rusqlite.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
keyring.workspace = true
rrule.workspace = true

[target.'cfg(windows)'.dependencies]
# Setting the process AppUserModelID at startup + writing the AUMID
# entry to HKCU is what lets Windows show "Aperio" instead of
# "Windows PowerShell" as the toast source. Both are needed because
# portable apps don't go through an installer.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# Lets the event-log applier's tests reuse the LocalAdapter's
# in-memory migrated SQLite without duplicating the schema replay.
cal-adapter-local = { workspace = true, features = ["test-support"] }
# sound_assets's tests need a concrete SyncAdapter to drive
# the manifest+sync round; LocalFsSyncAdapter is the natural
# choice. Not needed by the main binary — the orchestrator
# reaches it via the dlopen'd sync-adapter-local-plugin.
sync-adapter-local = { path = "../crates/sync-adapter-local" }

[features]
# Default: plugins are loaded dynamically as shared libraries (desktop).
default = ["dynamic-plugins"]
dynamic-plugins = []
# Mobile targets (section 25.1): compile all adapters in statically.
static-plugins = []

[lints]
workspace = true
