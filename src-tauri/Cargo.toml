[package]
name = "aperio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — accessible, cross-platform calendar and task application."
default-run = "aperio"

[[bin]]
name = "aperio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
# Native file picker for the SFTP SSH-key path (DESIGN.md §19.6).
# A bare text input would let users mis-type the path; the picker
# also matches the platform's "select a file" idiom (NSOpenPanel
# on macOS, common-item-dialog on Windows, the portal on Linux).
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
anyhow.workspace = true
# Used by the connect_dropbox_oauth command path to build a
# fresh HTTP client for the token exchange. The sync adapter
# crates already pull reqwest in via their own deps; declaring
# it here makes the use-site explicit + lets the command file
# `use reqwest` directly.
reqwest.workspace = true

cal-core.workspace = true
cal-adapter-local.workspace = true
sync-core.workspace = true
plugin-core.workspace = true
# Direct sync-adapter crate deps the host still needs even after
# the plugin migration:
#   - sync-adapter-local: used by sound_assets.rs's tests
#   - sync-adapter-sftp:  preview_sftp_host_key + the host-side
#                         UserPrefsHostKeyVerifier still build a
#                         direct SftpSyncAdapter for the §19.5
#                         TOFU first-use trust dialog
#   - sync-adapter-dropbox / -googledrive: OAuth dance helpers
#                         (oauth::run) — the host runs the
#                         consent flow before the plugin even
#                         opens an instance.
# sync-adapter-webdav / -ftp have no remaining direct call sites;
# everything they did now flows through the plugins.
sync-adapter-local = { path = "../crates/sync-adapter-local" }
sync-adapter-sftp = { path = "../crates/sync-adapter-sftp" }
sync-adapter-dropbox = { path = "../crates/sync-adapter-dropbox" }
sync-adapter-googledrive = { path = "../crates/sync-adapter-googledrive" }
cal-adapter-caldav = { path = "../crates/cal-adapter-caldav" }
cal-adapter-ical = { path = "../crates/cal-adapter-ical" }
cal-adapter-google = { path = "../crates/cal-adapter-google" }
cal-adapter-microsoft-graph = { path = "../crates/cal-adapter-microsoft-graph" }
cal-adapter-ews = { path = "../crates/cal-adapter-ews" }
cal-adapter-vikunja = { path = "../crates/cal-adapter-vikunja" }
cal-adapter-todoist = { path = "../crates/cal-adapter-todoist" }

# NOTE: the 13 *-plugin crates are NOT listed as deps here.
# Plugins are loaded via dlopen from `plugins/bundled/` at
# runtime (DESIGN.md §20.5 + §22.2). Listing them as deps would
# force the host to link the plugin rlibs, which would collide
# on `#[no_mangle] aperio_plugin_create` across all 13 plugins.
# `build.rs` stages the cdylibs into `target/<profile>/plugins/
# bundled/<id>/` so `cargo run -p aperio` can find them at
# startup — but `cargo build --workspace` must have run first
# to actually produce those cdylibs.

base64 = "0.22"

rusqlite.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
keyring.workspace = true
rrule.workspace = true

[target.'cfg(windows)'.dependencies]
# Setting the process AppUserModelID at startup + writing the AUMID
# entry to HKCU is what lets Windows show "Aperio" instead of
# "Windows PowerShell" as the toast source. Both are needed because
# portable apps don't go through an installer.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# Lets the event-log applier's tests reuse the LocalAdapter's
# in-memory migrated SQLite without duplicating the schema replay.
cal-adapter-local = { workspace = true, features = ["test-support"] }

[features]
# Default: plugins are loaded dynamically as shared libraries (desktop).
default = ["dynamic-plugins"]
dynamic-plugins = []
# Mobile targets (section 25.1): compile all adapters in statically.
static-plugins = []
