[package]
name = "aperio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — accessible, cross-platform calendar and task application."
default-run = "aperio"

[[bin]]
name = "aperio"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
# Native file picker for the SFTP SSH-key path (DESIGN.md §19.6).
# A bare text input would let users mis-type the path; the picker
# also matches the platform's "select a file" idiom (NSOpenPanel
# on macOS, common-item-dialog on Windows, the portal on Linux).
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
anyhow.workspace = true

cal-core.workspace = true
cal-adapter-local.workspace = true
sync-core.workspace = true
plugin-core.workspace = true
# Direct sync-adapter crate dep the host still needs after the
# plugin migration:
#   - sync-adapter-sftp:  preview_sftp_host_key + the host-side
#                         UserPrefsHostKeyVerifier still build a
#                         direct SftpSyncAdapter for the §19.5
#                         TOFU first-use trust dialog. Plugin
#                         migration needs a `probe_host_key` ABI
#                         extension — separate iteration.
# Dropbox / Google Drive OAuth dances moved into the plugins
# themselves via `interactive_auth` (Iteration 7); the host
# routes through `PluginManager::interactive_auth` instead of
# linking the adapter crates directly.
sync-adapter-sftp = { path = "../crates/sync-adapter-sftp" }
# No direct calendar-adapter deps left after Iteration 8.
# EWS Autodiscover moved into the cal-adapter-ews plugin via
# `aperio_plugin_discover` (DESIGN.md §20 service-discovery
# extension); the host routes through `PluginManager::discover`
# with a local `DiscoveredEndpoints` serde shape that matches
# the plugin's response JSON. Google / Microsoft Graph OAuth
# already left in Iteration 7; the 4 simple adapters (caldav,
# ical, vikunja, todoist) were fully plugin-routed end-to-end
# after Iteration 6b.

# NOTE: the 13 *-plugin crates are NOT listed as deps here.
# Plugins are loaded via dlopen from `plugins/bundled/` at
# runtime (DESIGN.md §20.5 + §22.2). Listing them as deps would
# force the host to link the plugin rlibs, which would collide
# on `#[no_mangle] aperio_plugin_create` across all 13 plugins.
# `build.rs` stages the cdylibs into `target/<profile>/plugins/
# bundled/<id>/` so `cargo run -p aperio` can find them at
# startup — but `cargo build --workspace` must have run first
# to actually produce those cdylibs.

base64 = "0.22"

rusqlite.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
keyring.workspace = true
rrule.workspace = true

[target.'cfg(windows)'.dependencies]
# Setting the process AppUserModelID at startup + writing the AUMID
# entry to HKCU is what lets Windows show "Aperio" instead of
# "Windows PowerShell" as the toast source. Both are needed because
# portable apps don't go through an installer.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
# Lets the event-log applier's tests reuse the LocalAdapter's
# in-memory migrated SQLite without duplicating the schema replay.
cal-adapter-local = { workspace = true, features = ["test-support"] }
# sound_assets's tests need a concrete SyncAdapter to drive
# the manifest+sync round; LocalFsSyncAdapter is the natural
# choice. Not needed by the main binary — the orchestrator
# reaches it via the dlopen'd sync-adapter-local-plugin.
sync-adapter-local = { path = "../crates/sync-adapter-local" }

[features]
# Default: plugins are loaded dynamically as shared libraries (desktop).
default = ["dynamic-plugins"]
dynamic-plugins = []
# Mobile targets (section 25.1): compile all adapters in statically.
static-plugins = []
