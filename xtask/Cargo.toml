[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Aperio — repository automation run as `cargo xtask <task>`: staging and packing the bundled plugins (DESIGN.md section 20.6), and generating the frontends' TypeScript declarations, the core's zone names and the Exchange zone table."
publish = false

[dependencies]
# The `.aperio` writer lives beside its reader, in plugin-core, so the two
# cannot drift into different ideas of the format. This task is the CLI over it.
plugin-core.workspace = true
# The workspace is the source of truth for which plugins exist, and
# `cargo metadata` is how you ask it. Parsed with serde_json rather than the
# `cargo_metadata` crate: three fields are needed, and a build tool earns its
# dependencies the same way anything else does.
serde_json.workspace = true
# `tz-list` reads the tzdata chrono-tz ships, and checks what it generates
# against the zones and offsets chrono-tz was built with: the release host-core
# and the adapters parse zones with.
chrono.workspace = true
chrono-tz.workspace = true
# `windows-zones` resolves every name in the CLDR windowsZones file through
# cal_core — the rule the EWS adapter asks at runtime — reads the file with the
# XML reader the adapters already use, and checks it against its pinned sha256.
cal-core.workspace = true
quick-xml.workspace = true
sha2.workspace = true

[lints]
workspace = true
