name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — but let main /
# master finish (those builds feed the artifact history). PR
# and feature pushes that get amended cancel their in-flight
# run so the now-heavier artifact matrix doesn't stack up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # clippy/build/test don't need full debuginfo — line-tables keep
  # panic backtraces readable while trimming a big chunk of the debug
  # compile + link time.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # Detect WHAT changed so the heavy Rust matrix is skipped when a commit
  # only touches the frontend (and the frontend checks are skipped when a
  # commit only touches Rust). A frontend-only change still rebuilds the
  # artifact — the UI is embedded in the binary at compile time — but no
  # longer pays for clippy/build/test of the whole Rust workspace, and the
  # heavy steps are gated PER STEP so the `rust` / `frontend` jobs still run
  # and report their status checks (required-check / branch-protection safe).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'src-tauri/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-artifacts.yml'
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - '.eslintrc*'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Every step below is gated on `needs.changes.outputs.rust`: on a
    # frontend-only change the job still runs (and the matrix checks report
    # green for branch protection), but it does no compilation.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (for Tauri)
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          # Keep the dep cache even on a failed run, so retries on a
          # red build don't recompile every dependency cold.
          cache-on-failure: true

      - name: rustfmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build the workspace BEFORE testing so the plugin
      # cdylibs (workspace members, but not cargo deps of
      # aperio — they're loaded via dlopen) land in
      # target/<profile>/ and src-tauri/build.rs stages them
      # into target/<profile>/plugins/bundled/<id>/. Without
      # this step the integration test
      # `scan_bundled_loads_every_expected_plugin_when_staged`
      # silently skips and the end-to-end dlopen path is
      # never verified on CI.
      #
      # Two build invocations are needed: the first produces
      # the cdylibs alongside aperio in parallel (aperio's
      # build.rs runs but the cdylibs may not exist yet —
      # there's no dep edge to enforce ordering, by design).
      # The second triggers aperio's build.rs to re-run via
      # `cargo:rerun-if-changed=<cdylib_src>` so the now-
      # present cdylibs get staged into plugins/bundled/.
      - name: cargo build (workspace + stage plugins)
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo build --workspace
          cargo build -p aperio

      - name: cargo test
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    # Gated per step like the Rust job: a Rust-only change skips the checks
    # but the job still reports green.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "20"
          cache: "npm"

      - name: npm ci
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      - name: TypeScript check
        if: needs.changes.outputs.frontend == 'true'
        run: npx tsc --noEmit

      - name: ESLint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Vitest
        if: needs.changes.outputs.frontend == 'true'
        run: npm test

  # Build the per-OS release zips (Linux x64, Windows x64,
  # Windows ARM64, macOS universal) on every commit / PR build,
  # not just on tagged releases — each lands as a downloadable
  # build artifact in the Actions run. Gated on the cheap
  # `rust` + `frontend` checks so the heavy 4-platform matrix
  # (incl. the double-arch macOS build) only runs once a commit
  # is actually green. No `version` input → artifact names use
  # the short commit SHA.
  #
  # Skipped when neither Rust nor the frontend changed (e.g. a docs-only
  # commit) — the artifact would be identical, so there's nothing to rebuild.
  artifacts:
    name: Build artifacts
    needs: [changes, rust, frontend]
    if: >-
      ${{ !cancelled()
      && needs.rust.result == 'success'
      && needs.frontend.result == 'success'
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true') }}
    uses: ./.github/workflows/build-artifacts.yml
