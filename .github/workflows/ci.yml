name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — but let main /
# master finish (those builds feed the artifact history). PR
# and feature pushes that get amended cancel their in-flight
# run so the now-heavier artifact matrix doesn't stack up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # clippy/build/test don't need full debuginfo — line-tables keep
  # panic backtraces readable while trimming a big chunk of the debug
  # compile + link time.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
  CARGO_PROFILE_TEST_DEBUG: "line-tables-only"

jobs:
  # Detect WHAT changed so the heavy Rust matrix is skipped when a commit
  # only touches the frontend (and the frontend checks are skipped when a
  # commit only touches Rust). A frontend-only change still rebuilds the
  # artifact — the UI is embedded in the binary at compile time — but no
  # longer pays for clippy/build/test of the whole Rust workspace, and the
  # heavy steps are gated PER STEP so the `rust` / `frontend` jobs still run
  # and report their status checks (required-check / branch-protection safe).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
      ffi: ${{ steps.filter.outputs.ffi }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'src-tauri/**'
              # Staging moved out of src-tauri/build.rs and into here, so this
              # is now the crate that decides whether any adapter reaches a
              # build. Without it an xtask-only commit sets rust=false, every
              # step of the job is skipped, and the whole thing reports green
              # having compiled nothing.
              - 'xtask/**'
              # Cross-language wire contracts. Rust `include_str!`s these, so a
              # commit that touches one and nothing else must compile Rust —
              # otherwise the halves that pin the contract (host-core's
              # `wire_contract`, adapter-caldav's) are skipped on exactly the
              # commit they exist to catch, while the TypeScript twin runs and
              # reports green. Same shape as the xtask hole above.
              - 'shared/contracts/**'
              # The generated TypeScript declarations. `cargo xtask ts-types
              # --check` regenerates them from the Rust types and compares, so
              # a commit that edits one of these BY HAND — the very thing
              # generation exists to stop — has to run the Rust job to be
              # caught. Only the generated half: the rest of shared/ is
              # ordinary frontend TypeScript.
              - 'shared/generated/**'
              # `the_app_no_longer_carries_names_for_adapters` READS
              # locales/{en,de}/translation.json at run time and panics on
              # invalid JSON. It is the guard that keeps adapter names out of
              # the app, and a locale-only commit skipped it entirely.
              - 'locales/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/build-artifacts.yml'
            # The four sides of the UniFFI seam. Any of them moving can put the
            # committed bindings out of step with the Rust, or a bridge out of
            # step with the bindings — and nothing else in CI reads Kotlin or
            # Swift. The check is a plain node script with no dependencies, so
            # it costs seconds and needs no install.
            # The React Native app. Nothing in CI compiled it: ~45k lines of
            # TypeScript with a `mobile/tsconfig.json` sitting right there,
            # and a mobile-only commit reported three green checks having run
            # nothing. `shared/` and `locales/` are in here too because mobile
            # resolves both through its own tsconfig `paths`, under its own
            # `strict` and its own Expo types — the desktop's check does not
            # answer for them.
            mobile:
              - 'mobile/**'
              - 'shared/**'
              - 'locales/**'
              - '.github/workflows/ci.yml'
            ffi:
              - 'crates/cal-ffi/**'
              - 'mobile/modules/cal-ffi/**'
              - 'mobile/scripts/check-ffi-bridges.mjs'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              # `src/i18n.ts` imports these JSON files directly, so they are
              # type-checked, tested and embedded in the shipped desktop
              # bundle. Editing a translation and nothing else used to compile
              # nothing at all.
              - 'locales/**'
              # Shared, platform-agnostic frontend TS the desktop compiles in
              # (tsconfig `include`), lints (`eslint .`) and tests. A change
              # here affects the desktop build, so it must run the frontend job.
              - 'shared/**'
              # The Rust the desktop calls synchronously from render, compiled
              # into the webview as WebAssembly. It is Rust, so the `rust`
              # filter catches it too — but the frontend is where its .d.ts is
              # type-checked and where the parity test proves it still answers
              # what the TypeScript answers.
              - 'crates/cal-core-wasm/**'
              # The core itself, because a rule the desktop calls through that
              # module lives here, not in the marshalling shell:
              # `cal_core::collation` decides how every list a person reads is
              # ordered, and `src/intl/collation.test.ts` asserts the answer
              # through the real WebAssembly module. Without this line a change
              # to the ordering rule alone would run no frontend job at all.
              - 'crates/cal-core/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - '.eslintrc*'
              - '.github/workflows/ci.yml'

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Every step below is gated on `needs.changes.outputs.rust`: on a
    # frontend-only change the job still runs (and the matrix checks report
    # green for branch protection), but it does no compilation.
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (for Tauri)
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          # Keep the dep cache even on a failed run, so retries on a
          # red build don't recompile every dependency cold.
          cache-on-failure: true

      - name: rustfmt
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check

      - name: clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build the workspace BEFORE testing so the plugin cdylibs (workspace
      # members, but not cargo deps of aperio — they are loaded via dlopen)
      # exist, then stage them where the host scans. Without this the
      # integration test `every_staged_plugin_loads` skips itself and the
      # end-to-end dlopen path is never exercised on CI.
      #
      # Two invocations, and now for an honest reason: the build makes the
      # libraries, the xtask copies them. It used to be two BUILDS, the second
      # existing only to make a build script rerun once the first had finished
      # producing what it needed — which it silently tolerated not finding.
      - name: cargo build (workspace + stage plugins)
        if: needs.changes.outputs.rust == 'true'
        run: |
          cargo build --workspace
          cargo xtask stage-plugins

      - name: cargo test
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace

      # The crates an ADAPTER repository compiles, built the way it compiles
      # them: alone, with their own default features. `cargo build --workspace`
      # cannot answer this — cargo unifies features across everything in one
      # build, so a frontend binding that switches on `cal-core/collation`
      # switches it on for the whole workspace and hides a crate that does not
      # compile without it.
      #
      # This is not hypothetical: `pub mod collation;` was declared
      # unconditionally while its dependencies were optional, and every check
      # in this file stayed green. The twelve adapter repositories would have
      # failed on `unresolved import icu_collator`.
      #
      # One OS is enough; this is a resolver question, not a platform one.
      - name: The contract crates compile on their own
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          cargo check -p cal-core
          cargo check -p plugin-core
          cargo check -p plugin-sdk

      # The frontends parse `shared/generated/`, which is produced from the
      # Rust types rather than mirrored by hand. A Rust field that never
      # reached TypeScript is a red build here, not a value that arrives on
      # the wire and is silently never read.
      #
      # One OS is enough — the generator reads Rust source and writes text,
      # and the comparison normalises line endings, so all three would answer
      # identically. It runs after the tests so a genuinely broken build
      # reports as a broken build.
      - name: TypeScript declarations are generated from the Rust
        if: needs.changes.outputs.rust == 'true' && matrix.os == 'ubuntu-latest'
        run: cargo xtask ts-types --check

  # The Rust host, the committed UniFFI bindings, and the Kotlin + Swift bridges
  # agree about every method and its arity. Deliberately its own job rather than
  # a step in `frontend`: it needs no npm install and no toolchain, so it can
  # report in seconds on a commit that touches nothing else — and it is the only
  # thing anywhere that reads the Swift bridge, which no machine here compiles.
  ffi-bridges:
    name: FFI bridges
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust, bindings and bridges agree
        if: needs.changes.outputs.ffi == 'true'
        run: node mobile/scripts/check-ffi-bridges.mjs

  # The React Native app's own type check — which is to say, the FIRST one.
  # The root `tsconfig.json` includes `src`, `locales`, `shared` and
  # `vite.config.ts`; `mobile` is not in it, so mobile's TypeScript has never
  # been type-checked by CI on any commit, not merely on mobile-only ones.
  #
  # Its own job rather than a step in `frontend`, because it answers a
  # different question: mobile has its own tsconfig — Expo's base, `strict`,
  # and `paths` that map `@aperio/shared` and `@aperio/locales` — so the
  # desktop passing says nothing about it.
  #
  # No lint step: the root `eslint .` already walks `mobile/` (it is not in
  # `.eslintrc.cjs`'s ignore list), so adding one here would run it twice. No
  # test step: mobile has no test runner yet, and a job that pretends to test
  # would be worse than one that says what it does.
  mobile:
    name: Mobile
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.mobile == 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json

      # BOTH installs, and the root one is not optional: `shared/*.ts` imports
      # `rrule` and `linkify-it`, which are declared at the repository root.
      # With only mobile's own install, tsc cannot resolve them and reports
      # four errors in files that are perfectly fine.
      - name: npm ci (root, for shared/)
        if: needs.changes.outputs.mobile == 'true'
        run: npm ci

      - name: npm ci (mobile)
        if: needs.changes.outputs.mobile == 'true'
        run: npm ci
        working-directory: mobile

      - name: TypeScript check
        if: needs.changes.outputs.mobile == 'true'
        run: npx tsc --noEmit
        working-directory: mobile

  frontend:
    name: Frontend
    needs: changes
    runs-on: ubuntu-latest
    # Gated per step like the Rust job: a Rust-only change skips the checks
    # but the job still reports green.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: "24"
          cache: "npm"

      - name: npm ci
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci

      # The core rules the desktop calls DURING render are compiled into the
      # webview as WebAssembly (`crates/cal-core-wasm`), because Tauri's
      # `invoke` is IPC and a React render cannot await. The module is a build
      # artifact and is NOT committed — only its source is, so it has to be
      # built here before anything can type-check against its .d.ts or run the
      # parity test against its bytes.
      #
      # That is why this job carries a Rust toolchain at all. It is not a
      # compromise: the desktop is a Tauri app, so its half of the tree needs
      # Rust either way.
      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.frontend == 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.frontend == 'true'
        with:
          # Its own cache key: this job builds ONE crate for wasm32, which
          # shares almost nothing with the host-target build the `rust` job
          # caches.
          key: wasm
          cache-on-failure: true

      - uses: jetli/wasm-pack-action@v0.4.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          version: latest

      - name: Build the core rules (WebAssembly)
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build:wasm

      - name: TypeScript check
        if: needs.changes.outputs.frontend == 'true'
        run: npx tsc --noEmit

      - name: ESLint
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint

      - name: Vitest
        if: needs.changes.outputs.frontend == 'true'
        run: npm test

  # Build the per-OS release zips (Linux x64, Windows x64,
  # Windows ARM64, macOS universal) on every commit / PR build,
  # not just on tagged releases — each lands as a downloadable
  # build artifact in the Actions run. Gated on the cheap
  # `rust` + `frontend` checks so the heavy 4-platform matrix
  # (incl. the double-arch macOS build) only runs once a commit
  # is actually green. No `version` input → artifact names use
  # the short commit SHA.
  #
  # Skipped when neither Rust nor the frontend changed (e.g. a docs-only
  # commit) — the artifact would be identical, so there's nothing to rebuild.
  artifacts:
    name: Build artifacts
    needs: [changes, rust, frontend]
    if: >-
      ${{ !cancelled()
      && needs.rust.result == 'success'
      && needs.frontend.result == 'success'
      && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend == 'true') }}
    uses: ./.github/workflows/build-artifacts.yml
    # A called workflow has its own secret scope and inherits nothing. Without
    # this, every OAuth client in the built artifact is empty — see the
    # `secrets:` declaration in build-artifacts.yml for what that cost.
    secrets:
      APERIO_OAUTH_WEBEX_CLIENT_ID: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_ID }}
      APERIO_OAUTH_WEBEX_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_SECRET }}
      APERIO_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_ID }}
      APERIO_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_SECRET }}
      APERIO_OAUTH_MICROSOFT_CLIENT_ID: ${{ secrets.APERIO_OAUTH_MICROSOFT_CLIENT_ID }}
