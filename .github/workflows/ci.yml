name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (for Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Build the workspace BEFORE testing so the plugin
      # cdylibs (workspace members, but not cargo deps of
      # aperio — they're loaded via dlopen) land in
      # target/<profile>/ and src-tauri/build.rs stages them
      # into target/<profile>/plugins/bundled/<id>/. Without
      # this step the integration test
      # `scan_bundled_loads_every_expected_plugin_when_staged`
      # silently skips and the end-to-end dlopen path is
      # never verified on CI.
      #
      # Two build invocations are needed: the first produces
      # the cdylibs alongside aperio in parallel (aperio's
      # build.rs runs but the cdylibs may not exist yet —
      # there's no dep edge to enforce ordering, by design).
      # The second triggers aperio's build.rs to re-run via
      # `cargo:rerun-if-changed=<cdylib_src>` so the now-
      # present cdylibs get staged into plugins/bundled/.
      - name: cargo build (workspace + stage plugins)
        run: |
          cargo build --workspace
          cargo build -p aperio

      - name: cargo test
        run: cargo test --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm test
