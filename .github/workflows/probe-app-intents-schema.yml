name: Probe App Intents schema

# Asks the iOS SDK what Apple's calendar assistant schema actually requires.
#
# `@AssistantIntent(schema:)` validates conformance at COMPILE time: the wrong
# property names are a build error, not a warning. Written from guesswork that
# costs one full EAS build (~25 minutes) per guess — and the feature it unlocks
# cannot even be observed without an Apple Intelligence device.
#
# So instead of guessing: the SDK on this runner contains the declarations. Two
# minutes of macOS time replaces a guessing loop, and the answer is durable —
# paste the output into the TODO and the implementation is written from facts.
#
# ANSWERED. Round 2 (run 30996369787, Xcode 26.6 / iPhoneOS26.5.sdk) settled it:
# there is NO calendar domain in the SDK. `.mail.createDraft` compiles in the
# same run, so the probe is sound; `.calendar.createEvent` fails at both the
# iOS 18 and the iOS 26 target, and `AppSchema` — the name Apple's own
# documentation uses — is not in scope at all. Counts in the module interface:
# calendar 0, CalendarIntent 0, AppSchema 0, createEvent 0, against
# AssistantSchemas 422.
#
# This workflow stays anyway, and not as leftovers. It is the RE-CHECK: Apple
# ships SDKs, and the day a calendar domain appears this answers in two minutes
# what would otherwise be a guessing loop at twenty-five minutes a build. Run
# it against a new Xcode and read the last step.
#
# Noted while here: `@AssistantIntent(schema:)` is deprecated, renamed to
# `@AppIntent`. Whatever uses a domain one day uses the new name.
#
# ROUND 1 said: `type 'AssistantSchemas.Intent' has no member 'calendar'`.
# Apple's documentation says the opposite — it names `.calendar.createEvent`
# outright, alongside `.calendar.event`, `.calendar.attendee` and the rest, and
# refers to them as `AppSchema.CalendarIntent`. `AppSchema` is not the namespace
# the compiler named, so one of three things is true: the domain is declared
# somewhere other than `AppIntents.framework`, it needs a deployment target
# above the 18.0 round 1 used, or the shorthand resolves against a type that was
# renamed. Round 1 could not tell those apart because it only ever asked ONE
# question, in one spelling, at one target.
#
# So this round stops guessing the spelling and goes looking instead: find which
# module in the SDK actually declares the thing, print that namespace, and try
# the candidate spellings side by side so the compiler says which resolves.
#
# Manual only. Nothing here builds or ships anything.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Where do the calendar schemas live?
    runs-on: macos-latest
    steps:
      - name: Locate the SDK
        id: sdk
        run: |
          echo "path=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      # Round 1 looked only inside AppIntents.framework. If the schemas are
      # declared anywhere else in the SDK, that is precisely what it could not
      # see — so ask the whole SDK which module mentions them at all.
      - name: Which module declares the calendar schemas?
        run: |
          set -uo pipefail
          SDK="${{ steps.sdk.outputs.path }}"
          echo "───── interfaces mentioning CalendarIntent / AppSchema / AssistantSchemas"
          grep -rl -E "CalendarIntent|AppSchema|AssistantSchemas" \
            "$SDK"/System/Library/Frameworks/*/Modules/*.swiftmodule/*.swiftinterface \
            2>/dev/null | head -40 || echo "(none)"
          echo
          echo "───── the same across PrivateFrameworks, in case it is not public yet"
          grep -rl -E "CalendarIntent|AppSchema" \
            "$SDK"/System/Library/PrivateFrameworks/*/Modules/*.swiftmodule/*.swiftinterface \
            2>/dev/null | head -20 || echo "(none)"

      # What round 1 should have printed: the members that DO exist, rather than
      # a filtered view of the one member we hoped for.
      - name: Enumerate the schema namespaces
        run: |
          set -uo pipefail
          SDK="${{ steps.sdk.outputs.path }}"
          IFACE="$SDK/System/Library/Frameworks/AppIntents.framework/Modules/AppIntents.swiftmodule/arm64e-apple-ios.swiftinterface"
          echo "───── every enum/struct under the schema namespaces"
          grep -n -E "(enum|struct) (AssistantSchemas|AppSchema)" "$IFACE" | head -40 || true
          echo
          echo "───── every domain shorthand declared on the intent schema type"
          # The domains are static members on the type the macro takes. Print all
          # of them: whatever calendar is called, it is in this list or nowhere.
          grep -n -B 2 -A 2 -E "extension (AssistantSchemas|AppSchema)\.(Intent|Entity|Enum)" \
            "$IFACE" | head -80 || true
          echo
          echo "───── static schema members, by name"
          grep -n -oE "public static (var|let|func) [a-zA-Z]+" "$IFACE" \
            | grep -iE "calendar|event|reminder|mail|photo|note|clock" | head -60 || true
          echo
          echo "───── raw counts (0 for calendar means it is simply not in this module)"
          for needle in calendar Calendar CalendarIntent AppSchema AssistantSchemas createEvent; do
            printf '%s: %s\n' "$needle" "$(grep -c "$needle" "$IFACE" 2>/dev/null || echo 0)"
          done

      # Same question, four spellings, so the compiler picks. Each is ~7s.
      # A failure is not a job failure — the diagnostic IS the output.
      - name: Which spelling resolves?
        run: |
          set -uo pipefail
          SDK="${{ steps.sdk.outputs.path }}"

          try() {
            local label="$1" target="$2" available="$3" schema="$4"
            echo "═════ $label"
            cat > /tmp/Probe.swift <<SWIFT
          import AppIntents

          @available(iOS $available, *)
          @AssistantIntent(schema: $schema)
          struct ProbeCreateEvent: AppIntent {
              func perform() async throws -> some IntentResult { .result() }
          }
          SWIFT
            xcrun swiftc -sdk "$SDK" -target "arm64-apple-ios$target" \
              -typecheck /tmp/Probe.swift 2>&1 | head -40 || true
            echo
          }

          # Round 1, repeated so this log stands alone.
          try "iOS 18 target, .calendar.createEvent" 18.0 18.0 ".calendar.createEvent"
          # The likeliest miss in round 1: a domain added long after iOS 18.
          try "iOS 26 target, .calendar.createEvent" 26.0 26.0 ".calendar.createEvent"
          # The name Apple's own documentation uses for these.
          try "iOS 26 target, AppSchema.CalendarIntent" 26.0 26.0 "AppSchema.CalendarIntent.createEvent"
          # A control: a domain that has existed since iOS 18. If THIS fails too,
          # the problem is the probe, not the calendar domain.
          try "iOS 26 target, .mail.createDraft (control)" 26.0 26.0 ".mail.createDraft"
