name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch: # allow manual runs

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; cancel superseded in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      # Build each book into its default `book/` directory, then assemble
      # `_site/` explicitly. mdBook resolves `--dest-dir` relative to the
      # current working directory, so relying on `../../` is brittle; this
      # avoids it entirely.
      - name: Build books
        run: |
          mdbook build docs/dev
          mdbook build docs/plugin-dev
          mdbook build docs/user
          mdbook build docs/user-en

      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp -r docs/dev/book _site/dev
          cp -r docs/plugin-dev/book _site/plugin-dev
          cp -r docs/user/book _site/user
          cp -r docs/user-en/book _site/user-en

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
