name: Mobile Android Play

# Full headless Android pipeline: build the cal-ffi Rust `.so` for the Android
# ABIs with cargo-ndk, drop them into the Expo module, then run EAS Build (+
# optional auto-submit to the Google Play INTERNAL testing track). Unlike iOS,
# no Mac is needed, so this is a single Linux job.
#
# Secrets:
#   EXPO_TOKEN                   - an Expo access token (already used by iOS).
#   GOOGLE_SERVICE_ACCOUNT_JSON  - the Google Play service-account key JSON, used
#                                  ONLY for auto-submit. Build-only runs (the very
#                                  first one) don't need it.
#
# The jniLibs `.so` are gitignored regenerable artifacts, so CI rebuilds them
# fresh every run and force-adds them into an EPHEMERAL commit that EAS captures
# (never pushed) — the binary never lives in git.
#
# Trigger: manual only. GitHub -> Actions -> "Mobile Android Play" -> Run
# workflow. FIRST TIME: run with submit = false, download the AAB from the EAS
# build page, and upload it to the Play Console once by hand (Google requires the
# first release to be created manually). After that, submit = true auto-submits.
# (workflow_dispatch only shows once this file is on the default branch.)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        default: production
        type: choice
        options: [production, preview]
      submit:
        description: Auto-submit to Google Play internal track (production only)
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      # Names and presence only — a credential must never reach a build log, so
      # nothing here prints a value or even a length. Turns a later "still says
      # no credentials stored" into one glance instead of a hunt.
      - name: Which OAuth clients this build can bake in
        env:
          APERIO_OAUTH_WEBEX_CLIENT_ID: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_ID }}
          APERIO_OAUTH_WEBEX_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_SECRET }}
          APERIO_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_ID }}
          APERIO_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_SECRET }}
          APERIO_OAUTH_MICROSOFT_CLIENT_ID: ${{ secrets.APERIO_OAUTH_MICROSOFT_CLIENT_ID }}
        run: |
          for v in APERIO_OAUTH_WEBEX_CLIENT_ID APERIO_OAUTH_WEBEX_CLIENT_SECRET                    APERIO_OAUTH_GOOGLE_CLIENT_ID APERIO_OAUTH_GOOGLE_CLIENT_SECRET                    APERIO_OAUTH_MICROSOFT_CLIENT_ID; do
            if [ -n "${!v:-}" ]; then echo "$v: present"; else echo "$v: MISSING"; fi
          done

      - name: Build cal-ffi .so for Android (release)
        env:
          # Baked at RUST compile time by crates/builtin-oauth/build.rs via
          # `option_env!` — present in the repository's secrets is not enough,
          # the cargo step's own environment is what gets read.
          APERIO_OAUTH_WEBEX_CLIENT_ID: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_ID }}
          APERIO_OAUTH_WEBEX_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_WEBEX_CLIENT_SECRET }}
          APERIO_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_ID }}
          APERIO_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.APERIO_OAUTH_GOOGLE_CLIENT_SECRET }}
          APERIO_OAUTH_MICROSOFT_CLIENT_ID: ${{ secrets.APERIO_OAUTH_MICROSOFT_CLIENT_ID }}
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t arm64-v8a -t x86_64 \
            -o mobile/modules/cal-ffi/android/src/main/jniLibs \
            build -p cal-ffi --release

      - name: Regenerate UniFFI Kotlin bindings (match the fresh .so)
        run: |
          cargo build -p cal-ffi --release
          cargo run -p cal-ffi --features cli --bin uniffi-bindgen -- \
            generate --library target/release/libcal_ffi.so \
            --language kotlin --out-dir target/uniffi-kotlin
          if [ -d target/uniffi-kotlin/uniffi ]; then
            rm -rf mobile/modules/cal-ffi/android/src/main/java/uniffi
            cp -R target/uniffi-kotlin/uniffi mobile/modules/cal-ffi/android/src/main/java/uniffi
          fi

      - name: Let the fresh .so into the EAS archive
        run: |
          # THE fix, and the reason two earlier attempts did nothing.
          #
          # `eas build` does not upload what git tracks. With `requireCommit`
          # unset — and `mobile/eas.json` sets only `appVersionSource` — it
          # clones with `--no-checkout` and then copies the WORKING TREE,
          # filtered by the `.gitignore` files it finds starting from the git
          # root. So the ephemeral commit below writes an index nothing reads,
          # and `mobile/.gitignore`'s jniLibs rule deletes both ABI directories
          # from the upload. Gradle then reports
          # `cal-ffi:mergeReleaseNativeLibs NO-SOURCE` and ships an AAB with no
          # native library, which the device reports as a missing libcal_ffi.so.
          #
          # A `.easignore` does not help unless it sits at the REPOSITORY root:
          # eas-cli joins exactly one path and does not recurse, so the earlier
          # `mobile/.easignore` was never read. A root one is worse than this
          # line — it REPLACES every `.gitignore` in the tree, so it would have
          # to re-list `/target/`, `/data/`, `/dist/`, `/src-tauri/target/` and
          # `web/`'s rules, and missing one uploads a full Rust build directory.
          #
          # Deleting the rule on the runner is the narrow move: it changes the
          # one thing standing between cargo-ndk's output and the upload, and
          # only on the ephemeral checkout.
          # A fixed-string filter, not a regex: the rule contains slashes, and
          # a sed address holding `$#` is a shell variable before sed ever sees
          # it — which is how the first draft of this line silently did nothing.
          grep -vFx '/modules/cal-ffi/android/src/main/jniLibs/' mobile/.gitignore > mobile/.gitignore.new
          mv mobile/.gitignore.new mobile/.gitignore
          if grep -q jniLibs mobile/.gitignore; then
            echo "the jniLibs rule survived; the archive would ship without the native library" >&2
            exit 1
          fi

      - name: Ephemeral commit so EAS captures the fresh .so
        run: |
          # Set the identity on the repo rather than passing it per command.
          # It used to live in a plain variable expanded unquoted, which split
          # "Aperio CI" on the space and handed git `CI` as its subcommand —
          # the step failed, no commit was made, and EAS then packaged the
          # PREVIOUS .so and Kotlin bindings. That is a silent version skew
          # that only shows up on the device, as a NoClassDefFoundError on the
          # first UniFFI call, so it must fail loudly here instead.
          git config user.email "ci@aperio.local"
          git config user.name "Aperio CI"
          # -f past the .gitignore on jniLibs; the Kotlin bindings are tracked.
          git add -f mobile/modules/cal-ffi/android/src/main/jniLibs
          git add mobile/modules/cal-ffi/android/src/main/java/uniffi
          git commit -m "ci: vendor fresh cal-ffi .so [not pushed]" || echo "nothing to commit"
          # This used to be the proof that the native library would ship, and
          # it proved nothing: it interrogates the git INDEX, which eas-cli
          # never reads. It passed on every build that then shipped without the
          # library. Kept only as a check that cargo-ndk wrote what it was asked
          # for; the real proof is the archive inspection further down.
          # Prove the artefacts are actually in the tree EAS will archive. A
          # missing .so here means the build would ship without the native
          # library and fail at runtime rather than at build time.
          # Both ABIs cargo-ndk was asked for. An AAB that carries only one of
          # them installs fine and then dies on the devices built for the
          # other, which is not something a store listing tells you about.
          git ls-files --error-unmatch \
            mobile/modules/cal-ffi/android/src/main/jniLibs/arm64-v8a/libcal_ffi.so \
            mobile/modules/cal-ffi/android/src/main/jniLibs/x86_64/libcal_ffi.so \
            > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        working-directory: mobile
        run: npm ci

      - name: Install eas-cli
        run: npm i -g eas-cli

      - name: Write Google service-account key (auto-submit only)
        if: ${{ github.event.inputs.submit != 'false' }}
        env:
          GSA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$GSA" > mobile/google-service-account.json

      - name: EAS build (+ optional submit)
        working-directory: mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          SUBMIT=""
          if [ "${{ github.event.inputs.submit }}" != "false" ] && [ "$PROFILE" = "production" ]; then
            SUBMIT="--auto-submit"
          fi
          # Ask eas-cli for the archive it WOULD upload, and look inside it.
          # Same code path as the build, so this cannot pass while the build
          # ships something else — which is precisely how the index check above
          # failed for months. Both ABIs: an AAB carrying one installs fine and
          # then dies on devices built for the other, and nothing in a store
          # listing says so.
          # `build:inspect` takes platform, profile, stage, output, force and
          # verbose — and nothing else. `--non-interactive` is a flag of
          # `build`, not of this one, and passing it aborted the step before
          # anything was inspected. It needs no such flag: every input it could
          # prompt for is given, and EXPO_TOKEN authenticates it.
          eas build:inspect --platform android --profile "$PROFILE" \
            --stage archive --output "$RUNNER_TEMP/eas-archive" \
            --force
          for abi in arm64-v8a x86_64; do
            lib="$RUNNER_TEMP/eas-archive/mobile/modules/cal-ffi/android/src/main/jniLibs/$abi/libcal_ffi.so"
            if [ ! -s "$lib" ]; then
              echo "libcal_ffi.so for $abi is missing from the archive EAS would upload" >&2
              exit 1
            fi
            echo "archive carries $abi: $(stat -c%s "$lib") bytes"
          done
          echo "eas build --platform android --profile $PROFILE $SUBMIT --non-interactive"
          eas build --platform android --profile "$PROFILE" $SUBMIT --non-interactive
