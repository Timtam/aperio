name: Build artifacts

# Reusable build pipeline shared by CI (commit / PR builds)
# and Release (tag / manual builds). For every target it
# produces a launch-ready zip — the raw aperio binary plus
# every bundled plugin cdylib under plugins/bundled/<id>/ —
# and uploads it as a build artifact. The caller decides when
# to run it; the Release workflow additionally publishes the
# resulting zips to a GitHub release.
on:
  workflow_call:
    inputs:
      version:
        description: >-
          Version label embedded in artifact names
          (Aperio-<version>-<target>.zip). A leading `v` is
          stripped. Empty → the short commit SHA, which is the
          right default for CI / PR builds.
        required: false
        type: string
        default: ''
      release_profile:
        description: >-
          Build with the full ship profile (fat LTO + single codegen
          unit) from Cargo.toml. Default false → LTO off + parallel
          codegen, for fast CI / PR test builds. release.yml passes
          true so real release artifacts stay fully optimised.
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Don't fail the artifact build on lint warnings — CI's
  # dedicated `rust` job already gates merges on `-D warnings`;
  # this path just needs to compile to a runnable binary.
  RUSTFLAGS: ""

jobs:
  # ── Native single-arch builds ────────────────────────────
  # Each target builds on a runner whose host arch matches the
  # artefact arch, so `cargo build --workspace` produces the
  # aperio binary AND every plugin cdylib for that arch in
  # one pass, and src-tauri/build.rs stages them under
  # target/release/plugins/bundled/. macOS is handled by the
  # separate `build-macos` job below (universal = two arches
  # lipo'd together, which this uniform flow can't express).
  build:
    name: Build (${{ matrix.label }})
    # CI / PR builds skip the ship profile's fat LTO + single codegen
    # unit (the dominant compile/link cost); release.yml passes
    # release_profile=true to restore the fully-optimised profile.
    # Cargo applies these overrides to `tauri build`'s release build.
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release_profile }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.release_profile && '1' || '16' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
            binary: aperio
          - os: windows-latest
            label: windows-x86_64
            binary: aperio.exe
          # GitHub-hosted ARM64 Windows runner (GA 2025). The
          # host is aarch64, so the standard flow builds the
          # ARM64 binary + every plugin cdylib natively — no
          # cross-compile. macOS is the separate universal job.
          - os: windows-11-arm
            label: windows-arm64
            binary: aperio.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies (for Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the dep cache even when a job fails, so iterating on
          # a red build doesn't recompile every dependency cold.
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # `cargo tauri build` with bundle.active = false produces
      # just the raw release binary. src-tauri is a workspace
      # member, so cargo writes to the WORKSPACE target dir
      # (repo-root `target/`, not `src-tauri/target/`). The
      # beforeBuildCommand chains `cargo build --workspace
      # --release` so every plugin cdylib lands in
      # target/release/ + src-tauri/build.rs stages them under
      # target/release/plugins/bundled/<id>/.
      - name: tauri build
        run: npm run tauri -- build

      # Sanity-check the staging step worked: the release zip is
      # useless without the plugin cdylibs. Counts immediate
      # subdirectories of plugins/bundled/ and compares against
      # build.rs's PLUGINS table. `shell: bash` keeps the
      # find-based count portable across Windows.
      - name: Verify every bundled plugin is staged
        shell: bash
        run: |
          set -euo pipefail
          # The expected number is DERIVED from build.rs, which is the table that
          # decides what gets staged. It used to be the literal 17, written out at
          # three places in this file plus once more in a Rust test — so unplugging
          # an adapter turned a correct build into a red one.
          expected=$(grep -c '"com\.aperio\.' src-tauri/build.rs)
          echo "build.rs stages $expected plugins"
          STAGED_DIR="target/release/plugins/bundled"
          if [ ! -d "$STAGED_DIR" ]; then
            echo "::error::Staged plugins dir missing: $STAGED_DIR"
            exit 1
          fi
          count=$(find "$STAGED_DIR" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          echo "Staged plugin count: $count"
          if [ "$count" -ne "$expected" ]; then
            echo "::error::Expected $expected staged plugins, found $count"
            echo "Contents of $STAGED_DIR:"
            ls -la "$STAGED_DIR" || true
            exit 1
          fi

      # Tag builds pass the tag (minus `v`); CI / PR builds pass
      # nothing and fall back to the short commit SHA.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Stage the portable layout next to the binary:
      #   Aperio-<version>-<label>/
      #     aperio[.exe]
      #     plugins/bundled/<id>/{plugin.json,*.{dll,dylib,so}}
      # The directory shape matches what
      # bundled_plugins::bundled_dir() resolves at runtime via
      # current_exe().parent().join("plugins/bundled"), so the
      # zip is launch-ready after extraction.
      - name: Stage portable layout
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          NAME="Aperio-${{ steps.version.outputs.version }}-${{ matrix.label }}"
          STAGE_DIR="dist-stage/$NAME"
          mkdir -p "$STAGE_DIR"
          cp "target/release/${{ matrix.binary }}" "$STAGE_DIR/"
          cp -R "target/release/plugins" "$STAGE_DIR/"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Upload the staged FOLDER directly — NOT a pre-made zip. GitHub
      # already zips every artifact on download, so uploading our own zip
      # produced a zip-inside-a-zip (`<name>.zip` ▸ `<name>.zip` ▸
      # `Aperio-…/`). Uploading the folder gives a single download zip
      # `<name>.zip` ▸ `Aperio-…/` ▸ files. The Release workflow re-zips
      # these folders into the release assets (so those keep their shape).
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          # `dist-stage` (its parent), not `dist-stage/<name>`, so the
          # named `Aperio-…/` top folder is kept inside the artifact
          # instead of being flattened to bare files at the zip root.
          path: dist-stage
          if-no-files-found: error

  # ── macOS universal (x86_64 + arm64) ─────────────────────
  # A universal artefact needs a fat binary AND fat copies of
  # every plugin cdylib. tauri's `--target universal-apple-
  # darwin` only lipo's the app binary, not the 17 separate
  # plugin crates — so we build the whole workspace for each
  # arch and lipo the binary plus every plugin ourselves.
  build-macos:
    name: Build (macos-universal)
    # Same profile override as the native `build` job — this is the
    # heaviest job (two full release arches), so LTO-off matters most.
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release_profile }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ inputs.release_profile && '1' || '16' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the dep cache even when a job fails, so iterating on
          # a red build doesn't recompile every dependency cold.
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      # Build the embedded frontend once up front (it's arch-
      # independent). The per-arch `cargo build` below compiles
      # the aperio binary, which embeds ../dist at compile time
      # via tauri-build — so dist/ must already exist. (We call
      # cargo directly instead of `tauri build` because the
      # universal artefact needs both arches of every plugin
      # cdylib, which `tauri build` doesn't produce.)
      - name: Build frontend
        run: npm run build

      # Build aperio + every plugin cdylib for both arches.
      # TWO passes per arch (mirrors the CI `rust` job + tauri's
      # beforeBuildCommand): the first builds aperio and the cdylibs
      # in parallel, but aperio's build.rs runs before the cdylibs
      # land (there's no dep edge, by design) so nothing is staged
      # yet; the second `-p aperio` pass re-triggers build.rs via
      # `cargo:rerun-if-changed=<cdylib>` so the now-present cdylibs
      # get staged into target/<triple>/release/plugins/bundled/<id>/.
      - name: Build workspace for both macOS arches
        run: |
          cargo build --workspace --release --target x86_64-apple-darwin
          cargo build -p aperio --release --target x86_64-apple-darwin
          cargo build --workspace --release --target aarch64-apple-darwin
          cargo build -p aperio --release --target aarch64-apple-darwin

      - name: Verify every plugin is staged, per arch
        shell: bash
        run: |
          set -euo pipefail
          # The expected number is DERIVED from build.rs, which is the table that
          # decides what gets staged. It used to be the literal 17, written out at
          # three places in this file plus once more in a Rust test — so unplugging
          # an adapter turned a correct build into a red one.
          expected=$(grep -c '"com\.aperio\.' src-tauri/build.rs)
          echo "build.rs stages $expected plugins"
          for triple in x86_64-apple-darwin aarch64-apple-darwin; do
            d="target/$triple/release/plugins/bundled"
            count=$(find "$d" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
            echo "$triple: $count plugins staged"
            if [ "$count" -ne "$expected" ]; then
              echo "::error::$triple staged $count plugins, expected $expected"
              exit 1
            fi
          done

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Fuse both arches: one universal binary + one universal
      # copy of every plugin cdylib via `lipo`. The plugin.json
      # manifests are arch-independent and copied as-is. The
      # resulting tree matches what bundled_plugins::bundled_dir()
      # resolves at runtime, so the zip is launch-ready.
      - name: Stage universal layout (lipo)
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          X64="target/x86_64-apple-darwin/release"
          ARM="target/aarch64-apple-darwin/release"
          NAME="Aperio-${{ steps.version.outputs.version }}-macos-universal"
          STAGE_DIR="dist-stage/$NAME"
          mkdir -p "$STAGE_DIR/plugins/bundled"

          lipo -create "$X64/aperio" "$ARM/aperio" -output "$STAGE_DIR/aperio"
          chmod +x "$STAGE_DIR/aperio"

          for dir in "$ARM/plugins/bundled"/*/; do
            id="$(basename "$dir")"
            out="$STAGE_DIR/plugins/bundled/$id"
            mkdir -p "$out"
            lipo -create \
              "$X64/plugins/bundled/$id/$id.dylib" \
              "$ARM/plugins/bundled/$id/$id.dylib" \
              -output "$out/$id.dylib"
            cp "$ARM/plugins/bundled/$id/plugin.json" "$out/plugin.json"
          done

          expected=$(grep -c '"com\.aperio\.' src-tauri/build.rs)
          count=$(find "$STAGE_DIR/plugins/bundled" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          if [ "$count" -ne "$expected" ]; then
            echo "::error::universal layout has $count plugins, expected $expected"
            exit 1
          fi

          archs="$(lipo -archs "$STAGE_DIR/aperio")"
          echo "universal binary archs: $archs"
          case " $archs " in
            *" x86_64 "*) ;;
            *) echo "::error::universal binary missing x86_64 slice ($archs)"; exit 1 ;;
          esac
          case " $archs " in
            *" arm64 "*) ;;
            *) echo "::error::universal binary missing arm64 slice ($archs)"; exit 1 ;;
          esac

          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # Upload the staged folder (see the native job above for why we
      # don't pre-zip): GitHub zips artifacts on download, so a pre-made
      # zip would nest one level too deep. `dist-stage` keeps the named
      # `Aperio-…/` top folder inside the artifact.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: dist-stage
          if-no-files-found: error
