name: Release

# Triggered when a tag matching `v*` is pushed (the canonical
# release path), AND from the Actions UI for manually
# re-running against an existing tag (the `tag` input becomes
# the release name).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). Re-uses the tag if it already exists; otherwise the upload step will fail.'
        required: true

jobs:
  # Build every OS artefact via the shared reusable workflow
  # (also used by CI for commit / PR builds). On a tag push the
  # version label is the tag (minus `v`); on manual dispatch
  # it's the `tag` input.
  artifacts:
    uses: ./.github/workflows/build-artifacts.yml
    with:
      version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs: [artifacts]
    runs-on: ubuntu-latest
    # Only attach to a release when we have a real tag —
    # workflow_dispatch runs land the zips as artifacts but
    # don't auto-publish (re-run with a tag for the actual
    # release).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      # softprops/action-gh-release needs contents: write to
      # create or update a release.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # The reusable workflow uploads one uniquely-named
          # artifact per target; flatten them all under `dist/`
          # without nesting per-artifact dirs.
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la dist

      - name: Compute tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Aperio ${{ steps.tag.outputs.tag }}
          # Draft so a human reviews + adds release notes before
          # publishing. Flip to false once the release-notes
          # generator is wired (separate iteration).
          draft: true
          files: dist/*.zip
