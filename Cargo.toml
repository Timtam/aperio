[workspace]
resolver = "2"
members = [
    # Kern-Bibliotheken
    "crates/aperio-db",
    "crates/cal-core",
    "crates/plugin-core",
    "crates/plugin-sdk",
    "crates/sync-core",
    "crates/sync-engine",
    "crates/vc-core",

    # Kalender- und Aufgaben-Adapter
    "crates/cal-adapter-google",
    "crates/cal-adapter-microsoft-graph",
    "crates/cal-adapter-ews",
    "crates/cal-adapter-caldav",
    "crates/cal-adapter-ical",
    "crates/cal-adapter-local",
    "crates/cal-adapter-vikunja",
    "crates/cal-adapter-todoist",
    "crates/cal-adapter-ical-plugin",
    "crates/cal-adapter-todoist-plugin",
    "crates/cal-adapter-vikunja-plugin",
    "crates/cal-adapter-caldav-plugin",
    "crates/cal-adapter-google-plugin",
    "crates/cal-adapter-microsoft-graph-plugin",
    "crates/cal-adapter-ews-plugin",

    # Sync-Adapter
    "crates/sync-adapter-webdav",
    "crates/sync-adapter-ftp",
    "crates/sync-adapter-sftp",
    "crates/sync-adapter-dropbox",
    "crates/sync-adapter-googledrive",
    "crates/sync-adapter-local",
    "crates/sync-adapter-local-plugin",
    "crates/sync-adapter-webdav-plugin",
    "crates/sync-adapter-ftp-plugin",
    "crates/sync-adapter-sftp-plugin",
    "crates/sync-adapter-dropbox-plugin",
    "crates/sync-adapter-googledrive-plugin",

    # Videokonferenz-Adapter
    "crates/vc-adapter-zoom",
    "crates/vc-adapter-teams",
    "crates/vc-adapter-meet",
    "crates/vc-adapter-webex",
    "crates/vc-adapter-zoom-plugin",
    "crates/vc-adapter-teams-plugin",
    "crates/vc-adapter-meet-plugin",
    "crates/vc-adapter-webex-plugin",

    # cdylib FFI shells: emit the #[no_mangle] C-ABI exports the desktop
    # dlopen loader resolves. The -plugin crates are rlib-only so the mobile
    # build can statically link them all into one binary (dlopen is
    # impossible on iOS) without colliding on duplicate plugin symbols.
    "crates/cal-adapter-caldav-cdylib",
    "crates/cal-adapter-ical-cdylib",
    "crates/cal-adapter-google-cdylib",
    "crates/cal-adapter-microsoft-graph-cdylib",
    "crates/cal-adapter-ews-cdylib",
    "crates/cal-adapter-vikunja-cdylib",
    "crates/cal-adapter-todoist-cdylib",
    "crates/sync-adapter-local-cdylib",
    "crates/sync-adapter-webdav-cdylib",
    "crates/sync-adapter-ftp-cdylib",
    "crates/sync-adapter-sftp-cdylib",
    "crates/sync-adapter-dropbox-cdylib",
    "crates/sync-adapter-googledrive-cdylib",
    "crates/vc-adapter-zoom-cdylib",
    "crates/vc-adapter-teams-cdylib",
    "crates/vc-adapter-meet-cdylib",
    "crates/vc-adapter-webex-cdylib",

    # Tauri-free host logic shared by the desktop backend and the mobile
    # UniFFI host (SQLite handle, paths, accounts, secrets, registry, …).
    "crates/host-core",

    # Static plugin registry: links the 17 -plugin rlibs + registers them into
    # a PluginManager without dlopen (the mobile/iOS path).
    "crates/host-plugins",

    # Mobile engine-reuse: UniFFI wrapper exposing cal-core to Swift/Kotlin.
    "crates/cal-ffi",

    # Tauri-App
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
authors = ["Aperio Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Timtam/Aperio"

# Workspace-wide clippy policy. CI runs `cargo clippy --workspace
# --all-targets -- -D warnings`; without these, recent clippy
# releases (1.95+) turn newly-tightened stylistic lints into
# hard build failures across hundreds of pre-existing doc
# comments. The allows below opt out of the ones we judge to be
# noise; the actual behavioural lints (correctness, perf,
# undefined-behaviour proxies) stay on as errors.
[workspace.lints.clippy]
# Doc-list rules tightened in clippy 1.95: emit "doc list item
# without indentation" (lint name: doc_lazy_continuation) and
# "doc list item overindented" (lint name: doc_overindented_list_items)
# against ~50 existing multi-line `///` comments in our crate
# tree. Our doc style intentionally uses 2-space inner bullets
# that don't always re-align with the parent; reformatting them
# would churn the whole tree for zero reader benefit.
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
# Signature-shape lints we choose to live with. Many of our
# Tauri commands legitimately take more than 7 args (every
# managed-State plus the call payload); rewriting them into
# request structs hides what the IPC contract actually needs.
too_many_arguments = "allow"
# `Mutex<Option<(Vec<X>, DateTime<Utc>)>>` is the cache shape
# every external-adapter uses; the proposed `type` alias would
# reduce reader signal more than it adds.
type_complexity = "allow"

[workspace.dependencies]
# Aperio internal crates
aperio-db = { path = "crates/aperio-db" }
cal-core = { path = "crates/cal-core" }
cal-adapter-local = { path = "crates/cal-adapter-local" }
host-core = { path = "crates/host-core" }
plugin-core = { path = "crates/plugin-core" }
plugin-sdk = { path = "crates/plugin-sdk" }
sync-core = { path = "crates/sync-core" }
sync-engine = { path = "crates/sync-engine" }
vc-core = { path = "crates/vc-core" }

# Async-Runtime.
# We deliberately do NOT use `features = ["full"]`. `full` additionally
# pulls in `process`, `signal`, `io-std` and `parking_lot`, none of which
# any crate in this workspace uses (no `tokio::process`, `tokio::signal`
# or `tokio::io::std*` anywhere; `parking_lot` is a pure internal locking
# optimisation with no public API). Those drivers and the parking_lot
# crate are dead weight that every one of the 17 statically-linked plugin
# cdylibs would otherwise carry its own copy of. The list below is exactly
# `full` minus those four. Workspace-inherited features are additive and
# cannot be subtracted per crate, so this is the single lever that trims
# tokio across the whole tree without touching individual manifests; any
# crate needing more (none currently do) just adds it locally.
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
async-trait = "0.1"
futures = "0.3"

# Serialisierung
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Datum & Zeit
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"

# HTTP / Protokolle
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
quick-xml = { version = "0.36", features = ["serialize"] }
icalendar = "0.16"
# RRULE expansion (RFC 5545) for the backend reminder scheduler so
# recurring events fire reminders for every occurrence, not just the
# series master. Frontend uses rrule.js in the renderer; the Rust
# side stays self-contained.
rrule = "0.14"

# Auth
oauth2 = "4"
keyring = "2"

# Krypto
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"

# Speicher
rusqlite = { version = "0.31", features = ["bundled"] }

# Plugin-System
libloading = "0.8"
# `.aperio` community-plugin archives are ZIP-based; the
# plugin-core installer extracts them under plugins/user/.
zip = { version = "2", default-features = false, features = ["deflate"] }

# System
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }

# Fehlerbehandlung
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling, non-blocking file appender for persistent (release) logs.
tracing-appender = "0.2"
# Used by the log-export redaction pass (scrub e-mails / token-like strings).
regex = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = 3
panic = "abort"

# Size-optimise dependency crates — the bulk of each plugin cdylib is the
# statically-linked tokio / reqwest / rustls (+ ring) / std stack, and every
# one of the 17 plugins carries its own copy. `"*"` matches every dependency
# but NOT a workspace member (Cargo reference → Profiles → Overrides), so our
# own code (the host binary, the adapters) keeps `[profile.release]`'s
# opt-level = 3 and its hot paths (recurrence expansion, rendering) stay
# speed-optimised. The deps are I/O-bound glue, so size over speed there is
# a free win. Measured on the caldav plugin (CI fast-release, LTO off): the
# dep stack is opt-level=3 4.65 MB → "s" 4.24 MB → "z" 4.15 MB; "z" wins
# another ~1.7 % over "s" because every byte of that glue is off the hot
# path, so we go all the way to size-first.
[profile.release.package."*"]
opt-level = "z"
