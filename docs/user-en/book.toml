[book]
title = "Aperio – User Guide"
language = "en"
src = "src"
authors = ["Aperio Contributors"]

[output.html]
site-url = "/aperio/user-en/"
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/Timtam/aperio"
edit-url-template = "https://github.com/Timtam/aperio/edit/main/docs/user-en/src/{path}"
additional-js = ["theme/lang-switcher.js"]

[output.html.search]
enable = true
limit-results = 20
